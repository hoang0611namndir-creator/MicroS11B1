spring.application.name=pharmacy-service
server.port=8081
# Bat buoc lay cau hinh tu Config Server (khong co optional: de bao loi ngay neu server chua chay)
management.endpoints.web.exposure.include=health,info,refresh,circuitbreakers,circuitbreakerevents
management.health.circuitbreakers.enabled=true
spring.config.import=configserver:http://localhost:8888 

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Redis Configuration
# ==============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ==============================
# Database Configuration
# Ví dụ PostgreSQL
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/pharmacy
spring.datasource.username=postgres
spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update

# Hiển thị SQL để kiểm tra cache
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG

# Hiển thị thời gian bind parameter nếu cần debug
logging.level.org.hibernate.orm.jdbc.bind=TRACE